name: Run Load Test

on:
  workflow_dispatch:
    inputs:
      users:
        description: 'Number of concurrent users'
        required: false
        default: '50'
        type: string
      spawn_rate:
        description: 'User spawn rate (users per second)'
        required: false
        default: '2'
        type: string
      run_time:
        description: 'Test duration (e.g., 10m, 1h)'
        required: false
        default: '10m'
        type: string
      test_type:
        description: 'Type of load test'
        required: false
        default: 'normal'
        type: choice
        options:
        - normal
        - stress
        - spike
      cleanup_after:
        description: 'Cleanup Locust deployment after test'
        required: false
        default: true
        type: boolean

permissions:
  id-token: write # required to use OIDC authentication
  contents: read # required to checkout the code from the repo

jobs:
  load-test:
    name: Execute Load Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_NUM }}:role/ex-iam-github-oidc
        role-duration-seconds: 3600 # Extended for load testing
        aws-region: eu-west-1

    - name: Install AWS CLI
      uses: unfor19/install-aws-cli-action@master
      with:
        version: 2.21.0

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --name eks-cluster --region eu-west-1 --kubeconfig ~/.kube/config

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Verify cluster connection
      run: |
        kubectl cluster-info
        kubectl get nodes

    - name: Check Online Boutique deployment
      run: |
        echo "Checking if Online Boutique is deployed..."
        kubectl get namespace app || (echo "Online Boutique not deployed. Please run 'Install Sample App' workflow first." && exit 1)
        kubectl get service frontend-external -n app || (echo "Frontend service not found. Please ensure Online Boutique is properly deployed." && exit 1)
        echo "Online Boutique is ready for load testing"

    - name: Deploy Locust
      run: |
        echo "Deploying Locust load testing infrastructure..."
        ./load-testing/scripts/deploy-locust.sh deploy

    - name: Configure test parameters
      run: |
        echo "Configuring test parameters..."
        USERS="${{ github.event.inputs.users }}"
        SPAWN_RATE="${{ github.event.inputs.spawn_rate }}"
        RUN_TIME="${{ github.event.inputs.run_time }}"
        TEST_TYPE="${{ github.event.inputs.test_type }}"
        
        echo "Test Configuration:"
        echo "- Users: $USERS"
        echo "- Spawn Rate: $SPAWN_RATE users/second"
        echo "- Duration: $RUN_TIME"
        echo "- Test Type: $TEST_TYPE"
        
        # Update ConfigMap with custom parameters
        kubectl patch configmap locust-config -n load-testing --patch "
        data:
          locust.conf: |
            web-host = 0.0.0.0
            web-port = 8089
            users = $USERS
            spawn-rate = $SPAWN_RATE
            run-time = $RUN_TIME
            loglevel = INFO
            logfile = /tmp/locust.log
            csv = /tmp/results
            csv-full-history
            html = /tmp/report.html
            print-stats
            headless = true
            host = http://frontend-external.app.svc.cluster.local
        "
        
        # Restart deployments to pick up new config
        kubectl rollout restart deployment/locust-master -n load-testing
        kubectl rollout restart deployment/locust-worker -n load-testing
        
        # Wait for rollout to complete
        kubectl rollout status deployment/locust-master -n load-testing --timeout=300s
        kubectl rollout status deployment/locust-worker -n load-testing --timeout=300s

    - name: Run load test
      run: |
        echo "Starting load test..."
        
        # Get the master pod name
        MASTER_POD=$(kubectl get pods -n load-testing -l app=locust,role=master -o jsonpath='{.items[0].metadata.name}')
        echo "Master pod: $MASTER_POD"
        
        # Start the test via API
        kubectl exec -n load-testing $MASTER_POD -- curl -X POST http://localhost:8089/swarm \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "user_count=${{ github.event.inputs.users }}&spawn_rate=${{ github.event.inputs.spawn_rate }}"
        
        echo "Load test started. Monitoring progress..."
        
        # Monitor test progress
        TEST_DURATION_SECONDS=$(echo "${{ github.event.inputs.run_time }}" | sed 's/m/*60/g' | sed 's/h/*3600/g' | sed 's/s//g' | bc)
        SLEEP_INTERVAL=30
        ITERATIONS=$((TEST_DURATION_SECONDS / SLEEP_INTERVAL))
        
        for i in $(seq 1 $ITERATIONS); do
          echo "Test progress: $((i * SLEEP_INTERVAL))/$TEST_DURATION_SECONDS seconds"
          
          # Get current stats
          kubectl exec -n load-testing $MASTER_POD -- curl -s http://localhost:8089/stats/requests | jq -r '
            .stats[] | select(.name != "Aggregated") | 
            "\(.name): \(.num_requests) requests, \(.num_failures) failures, avg: \(.avg_response_time)ms"
          ' || echo "Stats not available yet"
          
          sleep $SLEEP_INTERVAL
        done
        
        echo "Test duration completed. Stopping test..."
        kubectl exec -n load-testing $MASTER_POD -- curl -X GET http://localhost:8089/stop

    - name: Collect test results
      run: |
        echo "Collecting test results..."
        
        MASTER_POD=$(kubectl get pods -n load-testing -l app=locust,role=master -o jsonpath='{.items[0].metadata.name}')
        
        # Get final statistics
        echo "=== FINAL TEST RESULTS ==="
        kubectl exec -n load-testing $MASTER_POD -- curl -s http://localhost:8089/stats/requests | jq -r '
          .stats[] | 
          "Name: \(.name)",
          "Requests: \(.num_requests)",
          "Failures: \(.num_failures)",
          "Avg Response Time: \(.avg_response_time)ms",
          "Min Response Time: \(.min_response_time)ms", 
          "Max Response Time: \(.max_response_time)ms",
          "RPS: \(.current_rps)",
          "Failure Rate: \(.num_failures / .num_requests * 100)%",
          "---"
        '
        
        # Copy results files
        echo "Copying result files..."
        kubectl cp load-testing/$MASTER_POD:/tmp/results_stats.csv ./results_stats.csv || echo "Stats CSV not found"
        kubectl cp load-testing/$MASTER_POD:/tmp/results_stats_history.csv ./results_stats_history.csv || echo "History CSV not found"
        kubectl cp load-testing/$MASTER_POD:/tmp/report.html ./report.html || echo "HTML report not found"
        
        # Show logs
        echo "=== LOCUST MASTER LOGS ==="
        kubectl logs $MASTER_POD -n load-testing --tail=50

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: load-test-results-${{ github.run_number }}
        path: |
          results_*.csv
          report.html
        retention-days: 30

    - name: Performance analysis
      run: |
        echo "=== PERFORMANCE ANALYSIS ==="
        
        if [ -f "results_stats.csv" ]; then
          echo "Analyzing performance metrics..."
          
          # Basic analysis using awk
          awk -F',' 'NR>1 && $1!="Aggregated" {
            total_requests += $2
            total_failures += $3
            if($4 > max_avg_time) max_avg_time = $4
            if(min_avg_time == 0 || $4 < min_avg_time) min_avg_time = $4
          } END {
            failure_rate = (total_failures / total_requests) * 100
            print "Total Requests: " total_requests
            print "Total Failures: " total_failures
            print "Failure Rate: " failure_rate "%"
            print "Min Avg Response Time: " min_avg_time "ms"
            print "Max Avg Response Time: " max_avg_time "ms"
            
            if(failure_rate > 5) {
              print "⚠️  HIGH FAILURE RATE DETECTED!"
              exit 1
            } else if(max_avg_time > 2000) {
              print "⚠️  HIGH RESPONSE TIMES DETECTED!"
              exit 1
            } else {
              print "✅ Performance test passed"
            }
          }' results_stats.csv
        else
          echo "No results file found for analysis"
        fi

    - name: Cleanup Locust deployment
      if: always() && github.event.inputs.cleanup_after == 'true'
      run: |
        echo "Cleaning up Locust deployment..."
        ./load-testing/scripts/deploy-locust.sh cleanup

    - name: Test summary
      if: always()
      run: |
        echo "=== LOAD TEST SUMMARY ==="
        echo "Test Type: ${{ github.event.inputs.test_type }}"
        echo "Users: ${{ github.event.inputs.users }}"
        echo "Spawn Rate: ${{ github.event.inputs.spawn_rate }} users/second"
        echo "Duration: ${{ github.event.inputs.run_time }}"
        echo "Cleanup: ${{ github.event.inputs.cleanup_after }}"
        echo ""
        echo "Results have been uploaded as artifacts and are available for 30 days."
        echo "Check the 'Performance analysis' step above for key metrics."
