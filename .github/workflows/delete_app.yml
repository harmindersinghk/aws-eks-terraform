name: Delete Sample App

on:
  workflow_dispatch:

permissions:
  id-token: write # required to use OIDC authentication
  contents: read # required to checkout the code from the repo

jobs:
  terraform:
    name: Delete App - Helm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eks
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Use Terraform 1.3.0
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.3.0

    - name: Debug OIDC token claims
      env:
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ steps.identity_token.outputs.token }}
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ steps.identity_token.outputs.url }}
      run: |
        echo "Fetching GitHub OIDC token claims..."
        curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq '.claims'




    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_NUM }}:role/ex-iam-github-oidc
        role-duration-seconds: 900 # the ttl of the session, in seconds.
        aws-region: eu-west-1 # use your region here.

    - name: aws-cli
      id: install-aws-cli
      uses: unfor19/install-aws-cli-action@master
      with:
        version: 2.21.0
    - run: aws eks update-kubeconfig --name eks-cluster --region eu-west-1 --kubeconfig '~/.kube/config'
      working-directory: /

    - name: install-helm
      id: install
      uses: azure/setup-helm@v3
      with:
          version: 'v3.6.1' # default is latest (stable)

    - name: helm-uninstall
      id: deploy
      run: |
        helm uninstall onlineboutique --namespace=app --kubeconfig /home/runner/.kube/config
      working-directory: /