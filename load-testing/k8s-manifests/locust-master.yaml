apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  namespace: load-testing
  labels:
    app: locust
    role: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
      role: master
  template:
    metadata:
      labels:
        app: locust
        role: master
    spec:
      containers:
      - name: locust
        image: locustio/locust:2.17.0
        ports:
        - containerPort: 8089
          name: web-ui
        - containerPort: 5557
          name: master-bind
        - containerPort: 5558
          name: master-bind-2
        env:
        - name: LOCUST_MODE
          value: "master"
        - name: LOCUST_HOST
          value: "http://frontend-external.app.svc.cluster.local"
        - name: LOCUST_EXPECT_WORKERS
          value: "3"
        - name: LOCUST_WEB_HOST
          value: "0.0.0.0"
        - name: LOCUST_WEB_PORT
          value: "8089"
        volumeMounts:
        - name: locust-config
          mountPath: /home/locust
        - name: results
          mountPath: /tmp
        command:
        - locust
        - --config=/home/locust/locust.conf
        - --locustfile=/home/locust/locustfile.py
        - --master
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8089
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8089
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: locust-config
        configMap:
          name: locust-config
      - name: results
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: load-testing
  labels:
    app: locust
    role: master
spec:
  type: LoadBalancer
  ports:
  - port: 8089
    targetPort: 8089
    name: web-ui
  - port: 5557
    targetPort: 5557
    name: master-bind
  - port: 5558
    targetPort: 5558
    name: master-bind-2
  selector:
    app: locust
    role: master
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master-internal
  namespace: load-testing
  labels:
    app: locust
    role: master
spec:
  type: ClusterIP
  ports:
  - port: 5557
    targetPort: 5557
    name: master-bind
  - port: 5558
    targetPort: 5558
    name: master-bind-2
  selector:
    app: locust
    role: master
