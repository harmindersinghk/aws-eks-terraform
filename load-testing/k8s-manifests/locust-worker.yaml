apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  namespace: load-testing
  labels:
    app: locust
    role: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: locust
      role: worker
  template:
    metadata:
      labels:
        app: locust
        role: worker
    spec:
      containers:
      - name: locust
        image: locustio/locust:2.17.0
        env:
        - name: LOCUST_MODE
          value: "worker"
        - name: LOCUST_MASTER_HOST
          value: "locust-master-internal.load-testing.svc.cluster.local"
        - name: LOCUST_MASTER_PORT
          value: "5557"
        - name: LOCUST_HOST
          value: "http://frontend-external.app.svc.cluster.local"
        volumeMounts:
        - name: locust-config
          mountPath: /home/locust
        command:
        - locust
        - --config=/home/locust/locust.conf
        - --locustfile=/home/locust/locustfile.py
        - --worker
        - --master-host=$(LOCUST_MASTER_HOST)
        - --master-port=$(LOCUST_MASTER_PORT)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - pgrep
            - -f
            - locust
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pgrep
            - -f
            - locust
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: locust-config
        configMap:
          name: locust-config
