# Locust configuration file for Online Boutique load testing

# Web UI settings
web-host = 0.0.0.0
web-port = 8089

# Default test parameters
users = 50
spawn-rate = 2
run-time = 10m

# Logging
loglevel = INFO
logfile = /tmp/locust.log

# CSV output for results
csv = /tmp/results
csv-full-history

# HTML report
html = /tmp/report.html

# Print stats
print-stats

# Headless mode settings (can be overridden)
# headless = true
# host = http://frontend-external.app.svc.cluster.local
